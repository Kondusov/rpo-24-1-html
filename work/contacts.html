<h2>Форма связи</h2>
<p>напишите нам</p>

<form method="get">
    <input type="hidden" name="form1" value="user-f1">

        <label for="">Введите имя</label>

    <input type="email" placeholder="email">

    </p>
    <p>
        <label for="">Бронь с</label>
        <input type="date">
    </p>
    <p>
        <label for="">Бронь по</label>
        <input type="datetime-local">
    </p>
    <input type="file" accept=".txt">
    <input type="image">
    
    <input type="submit" formnovalidate="novalidate">
